<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orthros</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --ink: #16181d; --dim: #6b7280; --line: #e5e7eb;
  --a: #2563eb; --b: #9333ea; --good: #16a34a; --bad: #dc2626; --warn: #d97706;
  --track: #eef0f3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --card: #171a21; --ink: #e8eaef; --dim: #8b93a3; --line: #262b35;
    --a: #60a5fa; --b: #c084fc; --good: #4ade80; --bad: #f87171; --warn: #fbbf24;
    --track: #222733;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --card: #171a21; --ink: #e8eaef; --dim: #8b93a3; --line: #262b35;
  --a: #60a5fa; --b: #c084fc; --good: #4ade80; --bad: #f87171; --warn: #fbbf24;
  --track: #222733;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
.sub { color: var(--dim); font-size: 13px; }
.pill { margin-left: auto; padding: 4px 10px; border-radius: 999px; font-size: 12px;
  border: 1px solid var(--line); background: var(--card); display: flex; gap: 6px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
.pill.running .dot, .agent.on .dot { background: var(--good); animation: pulse 1.6s infinite; }
.pill.handover .dot { background: var(--warn); }
.pill.error .dot { background: var(--bad); }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 18px 0 12px; }
button, select, input { font: inherit; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; }
button { cursor: pointer; }
button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button:disabled { opacity: .45; cursor: default; }
input[type=number] { width: 72px; }
.link { background: none; border: none; color: var(--dim); text-decoration: underline; padding: 7px 4px; }
label { color: var(--dim); font-size: 13px; display: flex; gap: 6px; align-items: center; }

.banner { display: none; padding: 10px 12px; border-radius: 8px; margin-bottom: 12px;
  border: 1px solid var(--line); background: var(--card); white-space: pre-wrap; font-size: 13px; }
.banner.show { display: block; }
.banner.error { border-color: var(--bad); }

.agents { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; }
.agent { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
  min-width: 0; transition: border-color .3s; }
.agent.on { border-color: var(--c); }
.agent .top { display: flex; align-items: center; gap: 10px; }
.letter { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
  font-weight: 700; font-size: 18px; color: #fff; background: var(--c); flex: none; }
.role { font-weight: 600; }
.ver { color: var(--dim); font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
.now { margin: 12px 0 8px; min-height: 40px; font-size: 13px; }
.now .item { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--c); transition: width 1s linear; }
.nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
.num b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.num span { color: var(--dim); font-size: 11px; }
.totals { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--dim);
  font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.totals a { color: var(--dim); }
.swap { display: grid; place-items: center; color: var(--dim); font-size: 22px; }
.swap span { display: inline-block; transition: transform .6s; }
.countdown { display: flex; justify-content: space-between; align-items: baseline; }
.countdown b { font-size: 13px; color: var(--c); font-variant-numeric: tabular-nums; }
.bar i.low { background: var(--warn); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 12px; }
.card h2 { font-size: 13px; margin: 0 0 10px; color: var(--dim); font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
.share { display: grid; grid-template-columns: 70px 1fr 110px; gap: 10px; align-items: center; margin: 6px 0; font-size: 13px; }
.split { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--track); }
.split i { display: block; height: 100%; transition: width .6s; }
.split i:first-child { background: var(--a); } .split i:last-child { background: var(--b); }
.share .val { color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; font-size: 12px; }
.events { list-style: none; margin: 0; padding: 0; }
.events li { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.events li:last-child { border-bottom: none; }
.events time { color: var(--dim); font-variant-numeric: tabular-nums; flex: none; width: 42px; }
.events .k { width: 6px; height: 6px; border-radius: 50%; margin-top: 7px; flex: none; background: var(--dim); }
.k.good { background: var(--good); } .k.bad { background: var(--bad); } .k.handover { background: var(--warn); }
.k.start { background: var(--a); }
.empty { color: var(--dim); font-size: 13px; }

@media (max-width: 700px) {
  .agents { grid-template-columns: 1fr; }
  .swap { transform: rotate(90deg); height: 20px; }
  .nums { grid-template-columns: repeat(2, 1fr); }
  .share { grid-template-columns: 56px 1fr 90px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Orthros</h1>
    <span class="sub" id="sub">A improves B, B improves A</span>
    <span class="pill" id="pill"><span class="dot"></span><span id="phase">…</span></span>
  </header>

  <div class="controls">
    <button class="primary" id="start">Start</button>
    <label>first <select id="first"><option>A</option><option>B</option></select></label>
    <label>turns of <input type="number" id="minutes" min="5" max="480" step="5"> min</label>
    <button id="pause" title="Let the current session finish, then stop">Pause after this session</button>
    <button id="stop" title="Stop once the current round is done">Stop after this round</button>
    <button class="link" id="force" title="Kill the running agent now">force stop</button>
  </div>

  <div class="banner" id="banner"></div>

  <div class="agents">
    <section class="agent" id="agentA" style="--c: var(--a)"></section>
    <div class="swap"><span id="swap">&#8646;</span></div>
    <section class="agent" id="agentB" style="--c: var(--b)"></section>
  </div>

  <section class="card">
    <h2>Balance</h2>
    <div class="share"><span>Time</span><div class="split" id="timeSplit"><i></i><i></i></div><span class="val" id="timeVal"></span></div>
    <div class="share"><span>Tokens</span><div class="split" id="tokSplit"><i></i><i></i></div><span class="val" id="tokVal"></span></div>
  </section>

  <section class="card">
    <h2>Recent</h2>
    <ul class="events" id="events"><li class="empty">Nothing yet.</li></ul>
  </section>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtN = (n) => (n || 0) >= 1e6 ? ((n / 1e6).toFixed(1) + "M") : (n || 0) >= 1e3 ? (Math.round(n / 1e3) + "k") : String(n || 0);
const fmtLeft = (s) => { s = Math.max(0, Math.round(s));
  const m = Math.floor(s / 60); return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m`
    : m >= 5 ? `${m} min` : `${m}:${String(s % 60).padStart(2, "0")}`; };
const fmtT = (s) => { s = Math.max(0, Math.round(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}h ${m}m` : `${m}m`; };
const hhmm = (t) => new Date(t * 1000).toTimeString().slice(0, 5);
const PHASES = { idle: "Idle", paused: "Paused", running: "Running", handover: "Handing over", error: "Needs attention" };
let minutesTouched = false, swapTurn = 0, lastRunning = null;

async function post(path, body) {
  try { const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
        return await r.json(); } catch (e) { return { error: String(e) }; }
}

function agentCard(name, d) {
  const a = d.agents[name], run = d.running, on = run && run.agent === name, peer = name === "A" ? "B" : "A";
  const live = on ? d.live : null;
  let role = "Waiting", now = "";
  if (on) {
    role = `Working on ${peer}`;
    const total = run.minutes * 60, gone = live.elapsed || 0, left = Math.max(0, total - gone);
    const pct = Math.min(100, gone / total * 100);
    const tries = live.attempt && live.budget ? ` · try ${live.attempt} of ${live.budget}` : "";
    const what = live.phase === "starting" ? "starting up — loading the model" :
      `${esc(live.phase || "")}${live.round ? " · round " + live.round : ""}${tries}`;
    // What this round is carrying, and what the last one came to.
    const detail = [];
    if (live.files && live.files.length) {
      const names = live.files.slice(0, 3).join(", ") + (live.files.length > 3 ?
        ` +${live.files.length - 3}` : "");
      detail.push(`editing ${esc(names)}${live.files_total ? ` (of ${live.files_total})` : ""}` +
        (live.prompt_tokens ? ` · ~${fmtN(live.prompt_tokens)} tokens` : ""));
    } else if (live.files) detail.push("no source files this round");
    if (live.last_round_seconds) {
      const edits = live.edits_applied ? `${live.edits_applied} edit${live.edits_applied > 1 ? "s" : ""}`
        : live.edits_failed ? `${live.edits_failed} edit${live.edits_failed > 1 ? "s" : ""} missed` : "";
      detail.push(`last round ${live.last_round_seconds}s · ${fmtN(live.last_in)} in / ` +
        `${fmtN(live.last_out)} out${live.tok_per_sec ? ` · ${live.tok_per_sec} tok/s` : ""}` +
        (edits ? " · " + edits : ""));
    }
    if (live.review) detail.push(`reviewer: ${esc(live.review)}`);
    else if (live.outcome) detail.push(`result: ${esc(live.outcome)}`);
    if (live.symptom) detail.push(`trouble: ${esc(live.symptom === "enginedied" ? "the engine died" : "ran out of room")}`);
    now = `<div>${what}</div><div class="item">${esc(live.item || live.detail || "")}</div>
      ${detail.map((t) => `<div class="item">${t}</div>`).join("")}
      <div class="bar" style="margin-top:8px"><i class="${left < 120 ? "low" : ""}" style="width:${pct}%"></i></div>
      <div class="ver countdown" style="margin-top:4px"><b>${fmtLeft(left)} left</b>
        <span>${fmtT(gone)} of ${run.minutes}m</span></div>`;
  } else if (!d.paused && d.next === name) {
    role = "Up next"; now = `<div class="item">next turn: ${d.planned[name]} min on ${peer}</div>`;
  } else if (a.last && a.last.started) {
    const l = a.last;
    now = `<div class="item">last turn ${hhmm(l.started)}: ${l.launched ? `${l.rounds} rounds, ${l.kept} kept` : "failed to start"}</div>
      <div class="item">${esc(l.reason || "")}</div>`;
  } else now = `<div class="item">not run yet · first turn ${d.planned[name]} min</div>`;
  const s = on ? live : (a.last || {});
  const tokens = on ? (live.tokens_in || 0) + (live.tokens_out || 0) : (s.tokens || 0);
  const proof = a.unproven ? `${a.unproven} change set${a.unproven > 1 ? "s" : ""} waiting to prove` :
    (a.version === a.proven ? "proven" : "");
  return `<div class="top"><div class="letter">${name}</div>
      <div style="min-width:0"><div class="role">${role} ${on ? '<span class="dot" style="display:inline-block;margin-left:4px"></span>' : ""}</div>
      <div class="ver">version ${esc(a.version)}${proof ? " · " + proof : ""}</div></div></div>
    <div class="now">${now}</div>
    <div class="nums">
      <div class="num"><b>${s.rounds ?? 0}</b><span>rounds</span></div>
      <div class="num"><b>${on ? (live.accepted ?? 0) : (s.kept ?? 0)}</b><span>kept</span></div>
      <div class="num"><b>${on ? (live.rejected ?? 0) : (s.sent_back ?? 0)}</b><span>sent back</span></div>
      <div class="num"><b>${fmtN(tokens)}</b><span>tokens</span></div>
    </div>
    <div class="totals"><span>${a.sessions} turns</span><span>${fmtT(a.seconds)}</span><span>${fmtN(a.tokens)} tokens</span>
      <span>${a.kept} kept</span>${a.carried_in ? `<span>${a.carried_in} carried in</span>` : ""}
      ${a.rollbacks ? `<span style="color:var(--bad)">${a.rollbacks} rolled back</span>` : ""}
      <a href="/api/log?agent=${name}" target="_blank">log</a></div>`;
}

function split(el, val, a, b, fmt) {
  const t = a + b, pa = t ? a / t * 100 : 50;
  const bars = el.querySelectorAll("i"); bars[0].style.width = pa + "%"; bars[1].style.width = (100 - pa) + "%";
  val.textContent = t ? `${fmt(a)} · ${fmt(b)}` : "—";
}

function render(d) {
  const pill = $("#pill"); pill.className = "pill " + d.phase;
  $("#phase").textContent = (PHASES[d.phase] || d.phase) + (d.simulate ? " (simulation)" : "");
  $("#sub").textContent = d.running ? `${d.running.agent} is improving ${d.running.agent === "A" ? "B" : "A"}` : "A improves B, B improves A";
  const b = $("#banner"); const msg = d.message && (d.phase === "error" || d.phase === "paused") ? d.message : "";
  b.textContent = msg; b.className = "banner" + (msg ? " show" : "") + (d.phase === "error" ? " error" : "");
  const active = !d.paused || !!d.running;
  $("#start").disabled = active; $("#first").disabled = active;
  $("#pause").disabled = !active || !!d.stop_mode; $("#stop").disabled = !d.running || d.stop_mode === "now" || d.stop_mode === "force";
  $("#force").disabled = !d.running;
  if (!minutesTouched) $("#minutes").value = d.settings.session_minutes;
  $("#first").value = d.running ? d.running.agent : d.next;
  $("#agentA").innerHTML = agentCard("A", d); $("#agentB").innerHTML = agentCard("B", d);
  $("#agentA").classList.toggle("on", !!(d.running && d.running.agent === "A"));
  $("#agentB").classList.toggle("on", !!(d.running && d.running.agent === "B"));
  const who = d.running ? d.running.agent : null;
  if (who && who !== lastRunning) { swapTurn += 180; $("#swap").style.transform = `rotate(${swapTurn}deg)`; }
  lastRunning = who;
  const A = d.agents.A, B = d.agents.B;
  split($("#timeSplit"), $("#timeVal"), A.seconds, B.seconds, fmtT);
  split($("#tokSplit"), $("#tokVal"), A.tokens, B.tokens, fmtN);
  $("#events").innerHTML = d.events.length ? d.events.map(([t, text, kind]) =>
    `<li><time>${hhmm(t)}</time><span class="k ${esc(kind)}"></span><span>${esc(text)}</span></li>`).join("")
    : '<li class="empty">Nothing yet. Press Start.</li>';
}

async function tick() {
  try { const r = await fetch("/api/state"); render(await r.json()); }
  catch (e) { $("#phase").textContent = "Orthros is not running"; $("#pill").className = "pill error"; }
}

$("#minutes").addEventListener("input", () => { minutesTouched = true; });
$("#minutes").addEventListener("change", () => post("/api/settings", { session_minutes: +$("#minutes").value }));
$("#start").onclick = async () => { await post("/api/start", { first: $("#first").value, minutes: +$("#minutes").value }); minutesTouched = false; tick(); };
$("#pause").onclick = async () => { await post("/api/pause"); tick(); };
$("#stop").onclick = async () => { await post("/api/stop"); tick(); };
$("#force").onclick = async () => { if (confirm("Kill the running agent now? Its current round is lost.")) { await post("/api/force"); tick(); } };
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
